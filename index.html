
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYANET School Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f4f9;
    color: #17243b;
}

header {
    background: #10264b;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 27px;
    letter-spacing: 1px;
}

header p {
    color: #e7c66b;
    margin-bottom: 0;
}

.container {
    max-width: 650px;
    margin: 35px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 25px;
    margin-bottom: 22px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.07);
}

h2 {
    color: #10264b;
    margin-top: 0;
}

input, button {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border-radius: 7px;
    font-size: 15px;
}

input {
    border: 1px solid #cbd3df;
}

button {
    background: #10264b;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1b3d70;
}

.secondary {
    background: #b58b2b;
}

.secondary:hover {
    background: #96701c;
}

#schoolSection {
    display: none;
}

#logoutButton {
    background: #777;
}

#message {
    padding: 12px;
    border-radius: 7px;
    display: none;
    background: #e7f3e9;
    color: #205b2c;
    margin-bottom: 15px;
    overflow-wrap: anywhere;
}

footer {
    text-align: center;
    padding: 20px;
    color: #68758a;
    font-size: 13px;
}
</style>
</head>

<body>

<header>
    <h1>AYANET</h1>
    <h2 style="color:white; margin:8px 0;">SCHOOL MANAGER</h2>
    <p>Smart School Management System</p>
</header>

<div class="container">

    <div id="message"></div>

    <section class="card" id="accountSection">
        <h2>Create School Account</h2>

        <form id="signupForm">
            <input
                type="text"
                id="signupName"
                placeholder="Headteacher / Account Holder Name"
                required
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="School Email Address"
                required
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Create Password (minimum 8 characters)"
                minlength="8"
                required
            >

            <button type="submit">Create Account</button>
        </form>
    </section>

    <section class="card" id="loginSection">
        <h2>School Login</h2>

        <form id="loginForm">
            <input
                type="email"
                id="loginEmail"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>
    </section>

    <section class="card" id="schoolSection">
        <h2>Register Your School</h2>

        <p>Enter your school details to submit an application for AYANET approval.</p>

        <form id="schoolForm">
            <input
                type="text"
                id="schoolName"
                placeholder="Official School Name"
                required
            >

            <input
                type="text"
                id="schoolCounty"
                placeholder="County"
                required
            >

            <button type="submit" class="secondary">
                Submit School Registration
            </button>
        </form>

        <button id="logoutButton">Logout</button>
    </section>

</div>

<footer>
    AYANET School Manager &copy; 2026
    <br>
    Smart Learning. Better School Management.
</footer>

<script>
const SUPABASE_URL = "https://jltadhukraspfdaxbvwo.supabase.co";

const SUPABASE_KEY = "sb_publishable_tItrrAg_q9xSCskecgc5Jg_bJkxsOiu";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const messageBox = document.getElementById("message");

function showMessage(message, isError = false) {
    messageBox.style.display = "block";
    messageBox.textContent = message;
    messageBox.style.background = isError ? "#fde8e8" : "#e7f3e9";
    messageBox.style.color = isError ? "#9b2020" : "#205b2c";
}

function showLoggedIn() {
    document.getElementById("accountSection").style.display = "none";
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("schoolSection").style.display = "block";
}

function showLoggedOut() {
    document.getElementById("accountSection").style.display = "block";
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("schoolSection").style.display = "none";
}

async function checkSession() {
    const { data, error } = await client.auth.getSession();

    if (error) {
        showMessage(error.message, true);
        return;
    }

    if (data.session) {
        showLoggedIn();
    } else {
        showLoggedOut();
    }
}

// Create account
document.getElementById("signupForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;

    showMessage("Creating your account...");

    const { data, error } = await client.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                account_holder_name: name
            }
        }
    });

    if (error) {
        showMessage(error.message, true);
        return;
    }

    if (data.session) {
        showLoggedIn();
        showMessage("Account created successfully. Now register your school.");
    } else {
        showMessage("Account created. Please check your email for a confirmation link. After confirming, return here and log in.");
    }
});

// Login
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    showMessage("Signing in...");

    const { data, error } = await client.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        showMessage(error.message, true);
        return;
    }

    showLoggedIn();
    showMessage("Login successful. You can now register your school.");
});

// Register school
document.getElementById("schoolForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const schoolName = document.getElementById("schoolName").value.trim();
    const county = document.getElementById("schoolCounty").value.trim();

    showMessage("Submitting your school registration...");

    const { data, error } = await client.rpc("register_school", {
        p_school_name: schoolName,
        p_county: county
    });

    if (error) {
        showMessage(error.message, true);
        return;
    }

    document.getElementById("schoolForm").reset();

    showMessage("School registration submitted successfully! Your application is now awaiting AYANET Master Admin approval. Registration reference: " + data);
});

// Logout
document.getElementById("logoutButton").addEventListener("click", async function() {
    const { error } = await client.auth.signOut();

    if (error) {
        showMessage(error.message, true);
        return;
    }

    showLoggedOut();
    showMessage("You have logged out successfully.");
});

checkSession();
</script>

</body>
</html>
